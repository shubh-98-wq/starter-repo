<h1>{{categoryName}}</h1>

<!-- <pre>{{product$ | async | json}}</pre> -->


<div class="container">
    @for (item of product$ | async; track $index) {
    <div class="card">
        <button class="favorite">&#9825;</button>
        <img [src]="item.image" alt="" class="card-img">
        <div class="card-content">
            <h2 class="title">{{item.title}}</h2>
            <p class="price"><span class="new-price">{{item.price | currency:'INR'}}</span></p>
            <p class="desc">
                {{item.description | slice:0:100}}...
            </p>
            <div class="btn">
                <button class="buy-btn">BUY NOW</button>
                <button class="buy-btn">ADD TO CART</button>
            </div>

        </div>
    </div>
    <!-- <div class="title-container">
        <div class="img-container">
            <img [src]="item.image" alt="" />
        </div>
        <div class="price_container">
            <h2>{{item.title}}</h2>
            <h3>{{item.price | currency:'INR'}}</h3>
            <p>{{item.description}}</p>
            <button>Add to Cart</button>
        </div>
    </div> -->
    }
</div>
